name: ci

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        # Hosted runners cannot grant Accessibility: they cover Core, Config and the fakes.
        # Platform behaviour is verified in the owner's lab (docs/plan §12).
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      # Pinned by commit, not by tag (audit F10).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          swift --version
      - run: swift build
      - run: swift test
      # Timings on shared hosted runners are reported, not judged; the plan §11 budgets and the
      # baselines are enforced on real hardware by scripts/gate.sh.
      - run: swift run -c release tessera-bench --report
      - run: swift run -c release tessera-bench model 200000
